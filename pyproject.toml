[project]
name = "passlib"
version = "1.9.4"
description = "Comprehensive password hashing framework supporting over 30 schemes"
authors = [
    { name = "Eli Collins", email = "elic@assurancetechnologies.com" },
]
maintainers = [
    { name = "Noel", email = "notypecheck@gmail.com" },
]
dependencies = []
requires-python = ">=3.11"
readme = "README.md"
license = { text = "BSD" }
keywords = [
    "2fa",
    "apache",
    "argon2",
    "bcrypt",
    "crypt",
    "hash",
    "htdigest",
    "htpasswd",
    "md5-crypt",
    "passlib",
    "password",
    "pbkdf2",
    "scrypt",
    "secret",
    "security",
    "sha256-crypt",
    "sha512-crypt",
    "totp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/notypecheck/passlib"
Repository = "https://github.com/notypecheck/passlib"
Docs = "https://notypecheck.github.io/passlib/"
Issues = "https://github.com/notypecheck/passlib/issues"
Changelog = "https://github.com/notypecheck/passlib/blob/main/CHANGELOG.md"

[project.optional-dependencies]
argon2 = [
    "argon2-cffi>=18.2.0",
]
bcrypt = [
    "bcrypt>=3.1.0",
]
totp = [
    "cryptography>=43.0.1",
]

[dependency-groups]
dev = [
    "tox>=4.67.4",
    "tox-uv>=1.37.2",
]
lint = [
    "deptry>=0.25.1",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]
test = [
    "coverage>=7.17.0",
    "django>=5.0.0",
    "django-stubs>=5.0.0",
    "pytest>=9.2.0",
    "pytest-archon>=0.0.7",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "typeguard>=4.6.0",
]
docs = [
    "griffe-typingdoc>=0.3.2",
    "mkdocs-materialx>=10.2.2",
    "mkdocstrings[python]>=0.26",
    "properdocs>=1.6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "passlib",
]

[tool.uv]
package = true
default-groups = "all"
exclude-dependencies = ["mkdocs"]

[tool.uv.workspace]
members = ["test"]


[tool.coverage.run]
source = ["passlib"]
omit = []
command_line = "-m pytest -v"
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "class .*\\(.*\\bProtocol\\b.*\\):",
    "@(?:typing\\.)?overload",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2
fail_under = 0

[tool.deptry]
known_first_party = ["passlib"]

[tool.deptry.per_rule_ignores]
DEP001 = [
    "argon2pure",
    "fastpbkdf2",
    "scrypt",
]
DEP004 = [
    "django",
    "properdocs"
]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
unfixable = ["F401"]
ignore = [
    "PT011",
    "E501",
    "ISC001", # Conflicts with ruff format
    "COM812", # Conflicts with ruff format
    # Disabled categories
    "N",
    "ANN",
    "S",
    "FBT",
    "B",
    "A",
    "C4",
    "DTZ",
    "EM",
    "D",  # docstrings
    "PTH", # Pathlib
    "RUF",
    "PLR",
    "FIX",
    "TD",
    "ARG",
    "TRY",
    "SLF",
    "ERA",
    "C90",
    "PD", # Pandas
    "BLE",
    "FLY",
    "UP031",
    "PLW2901",
    "PLC0415", # `import` should be at the top-level of a file
    "CPY", # flake8-copyright
    "ICN",
]

[tool.ruff.lint.per-file-ignores]
"passlib/hash.py" = ["F401"]
"passlib/crypto/_blowfish/base.py" = ["E741"]
"passlib/crypto/_blowfish/unrolled.py" = ["E741"]
"docs/conf.py" = ["INP001"]
"passlib/*" = ["T"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.9.4"
tag_format = "$version"
update_changelog_on_bump = true
version_files = [
    "passlib/__init__.py",
    "pyproject.toml:version"
]


[tool.pytest.ini_options]
addopts = "-W error::Warning"


[tool.mypy]
python_version = "3.11"

follow_imports = "normal"
ignore_missing_imports = false


[tool.tox]
env_list = ["bcryptv4", "bcryptv5"]

[tool.tox.pytest]
runner = "uv-venv-lock-runner"
extras = ["argon2", "bcrypt", "totp"]
commands = [["pytest", "-n", "auto", "--cov"]]

[tool.tox.env.bcryptv4]
base = ["pytest"]
commands_pre = [["uv", "pip", "install", "bcrypt<5.0.0"]]

[tool.tox.env.bcryptv5]
base = ["pytest"]
commands_pre = [["uv", "pip", "install", "bcrypt>=5.0.0"]]
