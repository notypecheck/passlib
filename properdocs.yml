site_name: Passlib
docs_dir: docs
site_description: "A comprehensive password hashing framework for Python"
repo_url: https://github.com/notypecheck/passlib
edit_uri: blob/main/docs/
strict: true

hooks:
  - docs/griffe_warning.py

validation:
  links:
    absolute_links: relative_to_docs

theme:
  name: materialx
  favicon: assets/logo.ico
  features:
    - navigation.expand
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: deep orange

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            extensions:
              - griffe_typingdoc
            line_length: 55
            annotations_path: brief
            docstring_section_style: list
            docstring_style: sphinx
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false

            show_root_heading: true
            show_source: false
            show_signature: true
            show_bases: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            unwrap_annotated: true

nav:
  - Introduction: index.md
  - Getting Started:
    - Installation: guide/install.md
    - Overview: guide/overview.md
    - Quickstart: guide/quickstart.md
  - Tutorials:
    - Hash Tutorial: guide/hash-tutorial.md
    - Context Tutorial: guide/context-tutorial.md
    - TOTP Tutorial: guide/totp-tutorial.md
  - API Reference:
    - Overview: api/index.md
    - passlib.hash: api/passlib.hash.md
